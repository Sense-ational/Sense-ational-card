<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eefaf7">
  <meta name="description" content="Complete your five-sense journey with the Sense-ational digital stamp card.">
  <title>Sense-ational | Digital Stamp Card</title>

  <style>
    :root {
      --red: #a32626;
      --red-dark: #7f1717;
      --red-glow: rgba(127, 23, 23, 0.13);

      --cream: #eefaf7;
      --yellow: #fff2b2;
      --blue: #a9ddec;

      --green: #648767;
      --green-dark: #3f6244;

      --ink: #302638;
      --muted: #716773;

      --glass: rgba(255, 255, 255, 0.54);
      --glass-strong: rgba(255, 255, 255, 0.76);
      --glass-border: rgba(255, 255, 255, 0.86);

      --shadow:
        0 14px 40px rgba(48, 38, 56, 0.08);

      --radius: 25px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      color: var(--ink);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      line-height: 1.65;

      background:
        radial-gradient(
          ellipse at 5% 5%,
          rgba(169, 221, 236, 0.72),
          transparent 32rem
        ),
        radial-gradient(
          ellipse at 95% 25%,
          rgba(83, 157, 144, 0.20),
          transparent 34rem
        ),
        var(--cream);

      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button,
    input {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(100, 135, 103, 0.8);
      outline-offset: 4px;
    }

    button {
      cursor: pointer;
    }

    .icon {
      width: 25px;
      height: 25px;

      flex: 0 0 auto;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =================================
       PAGE LAYOUT
       ================================= */

    .container {
      width: min(100% - 32px, 560px);
      margin-inline: auto;
      padding: 35px 0 42px;
    }

    /* =================================
       BRAND HEADER
       ================================= */

    .header {
      position: relative;

      padding: 14px 10px 30px;

      text-align: center;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 76px;
      height: 76px;

      margin: 0 auto 16px;

      color: var(--green-dark);

      border: 1px solid rgba(100, 135, 103, 0.22);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.86),
          rgba(169, 221, 236, 0.23)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        0 8px 26px rgba(48, 38, 56, 0.06),
        0 0 22px rgba(169, 221, 236, 0.12);
    }

    .brand-mark .icon {
      width: 40px;
      height: 40px;
      stroke-width: 1.45;
    }

    .eyebrow {
      margin: 0 0 7px;

      color: var(--green-dark);

      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .header h1 {
      margin: 0;

      color: var(--red-dark);

      font-size: clamp(2.1rem, 8vw, 3rem);
      font-weight: 850;
      letter-spacing: -0.055em;
      line-height: 1.15;

      text-shadow:
        0 2px 12px rgba(127, 23, 23, 0.14),
        0 0 24px rgba(127, 23, 23, 0.05);
    }

    .header-description {
      max-width: 340px;

      margin: 13px auto 0;

      color: var(--muted);
      font-size: 0.96rem;
    }

    .heading-line {
      width: 65px;
      height: 3px;

      margin: 19px auto 0;

      border-radius: 99px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          #ffe7a0,
          #719b72
        );

      box-shadow:
        0 0 12px rgba(169, 221, 236, 0.4);
    }

    /* =================================
       GLASS CARDS
       ================================= */

    .card {
      position: relative;
      overflow: hidden;

      margin-bottom: 20px;
      padding: 25px;

      border: 1px solid var(--glass-border);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.77),
          rgba(255, 242, 178, 0.22)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        0 0 20px rgba(127, 23, 23, 0.045),
        var(--shadow);

      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
    }

    .card-heading {
      margin: 0;

      color: var(--red-dark);

      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.025em;

      text-align: center;

      text-shadow:
        0 2px 12px rgba(127, 23, 23, 0.10);
    }

    .card-subheading {
      margin: 6px 0 22px;

      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    /* =================================
       PARTICIPANT CARD
       ================================= */

    .participant {
      text-align: center;
      padding: 24px;
    }

    .participant-label {
      display: inline-block;

      padding: 5px 12px;

      color: var(--green-dark);

      border: 1px solid rgba(100, 135, 103, 0.19);
      border-radius: 99px;

      background: rgba(100, 135, 103, 0.09);

      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0.15em;
    }

    .participant-id {
      margin: 12px 0 5px;

      color: var(--red-dark);

      font-size: clamp(2rem, 8vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.04em;

      text-shadow:
        0 2px 13px rgba(127, 23, 23, 0.14),
        0 0 24px rgba(127, 23, 23, 0.06);
    }

    .participant p {
      margin: 7px 0 0;

      color: var(--muted);
      font-size: 0.88rem;
    }

    /* =================================
       SENSORY STATIONS
       ================================= */

    .sense-list {
      display: grid;
      gap: 13px;
    }

    .sense {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      width: 100%;
      min-height: 82px;

      padding: 15px;

      border: 1px solid rgba(127, 23, 23, 0.14);
      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.72),
          rgba(255, 242, 178, 0.18)
        );

      color: var(--ink);
      text-align: left;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        0 5px 16px rgba(48, 38, 56, 0.035);

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    .sense:hover {
      transform: translateY(-2px);

      border-color: rgba(127, 23, 23, 0.30);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        0 0 17px rgba(127, 23, 23, 0.08),
        0 9px 22px rgba(48, 38, 56, 0.06);
    }

    .sense:active {
      transform: scale(0.99);
    }

    .sense-left {
      display: flex;
      align-items: center;

      gap: 13px;
      min-width: 0;
    }

    .sense-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 48px;
      height: 48px;

      flex: 0 0 auto;

      color: var(--red-dark);

      border: 1px solid rgba(127, 23, 23, 0.14);
      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.91),
          rgba(169, 221, 236, 0.19)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.98),
        0 0 13px rgba(127, 23, 23, 0.045);
    }

    .sense-icon .icon {
      width: 25px;
      height: 25px;
    }

    .sense-name {
      display: block;

      color: var(--red-dark);

      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -0.02em;

      text-shadow:
        0 2px 10px rgba(127, 23, 23, 0.11);
    }

    .sense-description {
      display: block;

      margin-top: 2px;

      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      flex: 0 0 auto;

      padding: 7px 10px;

      border: 1px solid rgba(113, 103, 115, 0.12);
      border-radius: 99px;

      background: rgba(113, 103, 115, 0.08);

      color: #716773;

      font-size: 0.68rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #938a95;
    }

    .status.completed {
      color: var(--green-dark);

      border-color: rgba(63, 98, 68, 0.20);

      background: rgba(100, 135, 103, 0.13);
    }

    .status.completed .status-dot {
      background: var(--green-dark);
      box-shadow: 0 0 8px rgba(63, 98, 68, 0.25);
    }

    .sense.is-completed {
      border-color: rgba(63, 98, 68, 0.28);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.80),
          rgba(100, 135, 103, 0.12)
        );
    }

    .sense.is-completed .sense-icon {
      color: var(--green-dark);

      border-color: rgba(63, 98, 68, 0.20);

      background: rgba(100, 135, 103, 0.10);
    }

    .sense.is-completed .sense-name {
      color: var(--green-dark);

      text-shadow:
        0 2px 10px rgba(63, 98, 68, 0.12);
    }

    /* =================================
       PROGRESS
       ================================= */

    .progress {
      margin-top: 28px;
      padding: 19px;

      border: 1px solid rgba(127, 23, 23, 0.10);
      border-radius: 19px;

      background: rgba(255, 255, 255, 0.40);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .progress-label {
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 750;
    }

    .progress-count {
      color: var(--red-dark);
      font-size: 0.88rem;
      font-weight: 900;

      text-shadow:
        0 1px 8px rgba(127, 23, 23, 0.10);
    }

    .progress-bar {
      height: 11px;

      margin-top: 13px;

      overflow: hidden;

      border: 1px solid rgba(127, 23, 23, 0.06);
      border-radius: 99px;

      background: rgba(48, 38, 56, 0.08);
    }

      width: 0%;
      height: 100%;

      background:
